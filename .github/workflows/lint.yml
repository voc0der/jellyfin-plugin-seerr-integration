name: Lint

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.x

    - name: Setup Node
      uses: actions/setup-node@v7
      with:
        node-version: 26

    - name: Restore dependencies
      run: |
        dotnet restore
        dotnet restore tests/Jellyfin.Plugin.SeerrIntegration.Tests/Jellyfin.Plugin.SeerrIntegration.Tests.csproj

    - name: Check plugin GUID
      run: bash scripts/verify-plugin-guid.sh

    - name: Run unit tests
      run: dotnet test tests/Jellyfin.Plugin.SeerrIntegration.Tests/Jellyfin.Plugin.SeerrIntegration.Tests.csproj --configuration Release --no-restore

    # The Requests page's own logic: permissions, request states, routes and the proxy client.
    # Plain node:test, no packages to install.
    - name: Run Requests page unit tests
      run: node --test tests/web/

    - name: Check the Requests page parses
      run: |
        node --check Web/seerr-integration.js
        node --check Browser/bootstrap.js

    - name: Check whitespace formatting
      run: dotnet format whitespace --verify-no-changes --verbosity minimal

    - name: Check C# style formatting
      run: dotnet format style --verify-no-changes --severity warn --verbosity minimal

    - name: Check test whitespace formatting
      run: dotnet format tests/Jellyfin.Plugin.SeerrIntegration.Tests/Jellyfin.Plugin.SeerrIntegration.Tests.csproj whitespace --verify-no-changes --verbosity minimal

    - name: Check test C# style formatting
      run: dotnet format tests/Jellyfin.Plugin.SeerrIntegration.Tests/Jellyfin.Plugin.SeerrIntegration.Tests.csproj style --verify-no-changes --severity warn --verbosity minimal
